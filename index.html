<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduPlatform | المنصة التعليمية</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#182c45;background:#f2f6fc}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{width:245px;flex-shrink:0;background:#112944;color:#fff;padding:23px 12px}aside h2{margin:0 10px 28px}nav button{width:100%;display:block;text-align:right;background:transparent;color:#dce7f5;border:0;padding:13px;border-radius:9px;cursor:pointer;font:inherit;margin:2px 0}nav button.active,nav button:hover{background:#0877e8;color:#fff}main{padding:25px;flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top small{color:#64748b}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:23px 0}.card,.panel{background:white;border:1px solid #e4ebf5;border-radius:14px;padding:18px;box-shadow:0 5px 16px #102b4210}.card b{display:block;font-size:28px;margin-top:12px;color:#0969c5}.card span{font-size:13px;color:#64748b}.panel{margin-top:16px}h3{margin:0 0 15px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:right;padding:12px;border-bottom:1px solid #e8edf4}th{background:#f5f8fd}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px;flex-wrap:wrap}button.primary{background:#0877e8;border:0;color:white;border-radius:9px;padding:11px 17px;cursor:pointer}button.danger{background:#fee2e2;border:0;color:#991b1b;padding:7px;border-radius:6px;cursor:pointer}.form{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}input,select{border:1px solid #ccd8e6;padding:11px;border-radius:8px;font:inherit;min-width:130px;flex:1}.muted{color:#64748b;font-size:13px}.hidden{display:none}.notice{background:#fff7e5;border:1px solid #f5dca1;border-radius:10px;padding:12px;margin-top:20px;font-size:13px}@media(max-width:800px){.app{display:block}aside{width:auto;padding:12px}aside h2{margin:4px 6px 12px}nav{display:flex;overflow-x:auto;gap:5px}nav button{white-space:nowrap;width:auto}main{padding:14px}.cards{grid-template-columns:repeat(2,1fr)}table{font-size:12px}th,td{padding:7px}.panel{overflow-x:auto}}
</style></head><body><div class="app"><aside><h2>🎓 EduPlatform</h2><nav id="nav"></nav></aside><main><div class="top"><div><h1 id="heading">لوحة التحكم</h1><small>المنصة التعليمية • نسخة . التجريبية</small></div><span>👤 مدير النظام</span></div><div id="content"></div><div class="notice">تنبيه: البيانات محفوظة محليًا في هذا المتصفح فقط، وليست مشتركة بين الأجهزة. هذه نسخة تجريبية وليست مناسبة لحفظ بيانات طلاب حقيقية أو معلومات مالية حساسة.</div></main></div><script>
const types={students:{title:'الطلاب',icon:'👨‍🎓',fields:['اسم الطالب','المرحلة','الرقم الدراسي']},teachers:{title:'المدرسون',icon:'👩‍🏫',fields:['اسم المدرس','التخصص','رقم الموظف']},courses:{title:'المقررات',icon:'📚',fields:['اسم المقرر','المرحلة','اسم المدرس']},attendance:{title:'الحضور والغياب',icon:'📅',fields:['اسم الطالب','التاريخ','الحالة']},fees:{title:'الأقساط والمالية',icon:'💳',fields:['اسم الطالب','المبلغ','الحالة']},announcements:{title:'الإعلانات',icon:'📢',fields:['عنوان الإعلان','التفاصيل','التاريخ']}};
const samples={students:[['أحمد محمد','الثانوية','2024001'],['سارة علي','الإعدادية','2024002']],teachers:[['محمد أحمد','الرياضيات','T001']],courses:[['الرياضيات','الثانوية','محمد أحمد']],attendance:[['أحمد محمد','2026-10-02','حاضر']],fees:[['أحمد محمد','120000','مدفوع']],announcements:[['بدء الفصل الدراسي','مرحبًا بالطلاب','2026-10-02']]};
let data;try{data=JSON.parse(localStorage.getItem('edu_demo_v1'))||samples}catch(e){data=samples}for(const k in types)if(!Array.isArray(data[k]))data[k]=[];
const save=()=>localStorage.setItem('edu_demo_v1',JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current='dashboard';
function show(page){current=page;document.getElementById('heading').textContent=page==='dashboard'?'لوحة التحكم':types[page].title;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const el=document.getElementById('content');if(page==='dashboard'){el.innerHTML='<div class="cards">'+[['الطلاب',data.students.length,'👨‍🎓'],['المدرسون',data.teachers.length,'👩‍🏫'],['المقررات',data.courses.length,'📚'],['الأقساط المسجلة',data.fees.length,'💳']].map(a=>`<div class="card"><span>${a[2]} ${a[0]}</span><b>${a[1]}</b></div>`).join('')+'</div><div class="panel"><h3>آخر الطلاب المسجلين</h3>'+table('students',true)+'</div><div class="panel"><h3>أحدث الإعلانات</h3>'+table('announcements',true)+'</div>';return}el.innerHTML=`<div class="panel"><div class="toolbar"><h3>${types[page].icon} إدارة ${types[page].title}</h3><button class="primary" id="addToggle">+ إضافة سجل</button></div><form id="entry" class="form hidden">${types[page].fields.map((f,i)=>`<input name="f${i}" required placeholder="${f}" aria-label="${f}">`).join('')}<button class="primary" type="submit">حفظ</button></form><div id="tbl">${table(page)}</div></div>`;document.getElementById('addToggle').onclick=()=>document.getElementById('entry').classList.toggle('hidden');document.getElementById('entry').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);data[page].push(types[page].fields.map((_,i)=>String(fd.get('f'+i)).trim()));save();show(page)};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('هل تريد حذف السجل؟')){data[page].splice(Number(b.dataset.del),1);save();show(page)}})}
function table(page,short=false){const t=types[page],arr=short?data[page].slice(-5):data[page];return `<table><thead><tr>${t.fields.map(f=>`<th>${esc(f)}</th>`).join('')}${short?'':'<th>إجراء</th>'}</tr></thead><tbody>${arr.length?arr.map((r,i)=>`<tr>${t.fields.map((_,j)=>`<td>${esc(r[j])}</td>`).join('')}${short?'':`<td><button class="danger" data-del="${i}">حذف</button></td>`}</tr>`).join(''):`<tr><td colspan="${t.fields.length+1}" class="muted">لا توجد سجلات</td></tr>`}</tbody></table>`}
const nav=document.getElementById('nav');nav.innerHTML='<button data-page="dashboard">🏠 الرئيسية</button>'+Object.entries(types).map(([k,v])=>`<button data-page="${k}">${v.icon} ${v.title}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.page));show('dashboard');
</script></body></html>
